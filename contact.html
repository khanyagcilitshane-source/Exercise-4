<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Madrid Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animate.css -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html#home">
                Madrid Store
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html#home">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="product.html#products">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html#about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html#contact">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section id="contact" class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <!-- Heading -->
                <div class="card p-4 shadow mb-4 animate__animated animate__fadeInDown">

                    <h2 class="text-center mb-0">
                        Contact Us
                    </h2>

                </div>


                <!-- Contact Form -->
                <form class="card p-4 shadow animate__animated animate__fadeInUp">

                    <input type="text"
                           class="form-control mb-3"
                           placeholder="Name"
                           required>

                    <input type="email"
                           class="form-control mb-3"
                           placeholder="Email"
                           required>

                    <textarea class="form-control mb-3"
                              rows="4"
                              placeholder="Message"
                              required></textarea>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Send Message

                    </button>

                </form>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">

        <p class="mb-0">
            &copy; 2026 Madrid Store. Hala Madrid!
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
